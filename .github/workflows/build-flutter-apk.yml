name: Build Flutter APK

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions
  push:
    branches:
      - featured
      - dev
      - core
    paths:
      - 'src/eShop_flutter/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos
        run: dart pub global activate melos

      - name: Add Pub Cache Bin to Path
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap Melos
        run: melos bootstrap
        working-directory: src/eShop_flutter

      - name: Build APK
        run: flutter build apk --release
        working-directory: src/eShop_flutter/apps/mobile_app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/eShop_flutter/apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
